name: Fork sync

# Fork-only workflow (mbuckaway/kimi-code). Keeps both protected branches
# current with upstream:
#   1. main      — pristine mirror; direct fast-forward push of upstream/main.
#                  The pristine-main ruleset carries a repository-admin bypass
#                  for this push. A PR rebase-merge would rewrite committer
#                  info and SHAs, so a PR flow can never keep the mirror
#                  byte-identical.
#   2. fork/main — integration mainline; sync PR merges upstream/main into it.
# Requires the FORK_SYNC_PAT secret (contents + pull_requests + issues +
# workflows, scoped to this fork): GITHUB_TOKEN-created PRs do not trigger CI
# and cannot carry workflow-file changes from upstream.
# GH_REPO pins every gh call to this repository. Without it, gh resolves the
# parent repo (MoonshotAI/kimi-code) once the `upstream` remote exists, and
# the fork-scoped PAT has no write access there.

on:
  schedule:
    # ~every 48 hours at 07:23 UTC (cron has no true 48h field; */2 dom is the standard approximation)
    - cron: '23 7 */2 * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

env:
  GH_TOKEN: ${{ secrets.FORK_SYNC_PAT }}
  GH_REPO: ${{ github.repository }}

jobs:
  sync-main:
    name: Sync pristine main
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.FORK_SYNC_PAT }}

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/MoonshotAI/kimi-code.git
          git fetch upstream main

      - name: Mirror upstream/main to main
        run: |
          if git merge-base --is-ancestor upstream/main origin/main; then
            echo "main is already up to date"
            exit 0
          fi
          # Fast-forward push: the healthy case. main is a pristine mirror of
          # upstream/main by definition, so if the plain push is rejected the
          # mirror has diverged (pollution) — self-heal with a force-with-lease
          # reset instead of failing closed. The pristine-main ruleset carries a
          # repository-admin bypass for this push (see header). Never force
          # fork/main — that ruleset has no bypass.
          git push origin refs/remotes/upstream/main:refs/heads/main \
            || git push --force-with-lease origin refs/remotes/upstream/main:refs/heads/main

  sync-fork-main:
    name: Merge upstream into fork/main
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork/main
        uses: actions/checkout@v6
        with:
          ref: fork/main
          fetch-depth: 0
          token: ${{ secrets.FORK_SYNC_PAT }}

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/MoonshotAI/kimi-code.git
          git fetch upstream main

      - name: Merge upstream/main into a sync branch
        id: merge
        run: |
          set -euo pipefail
          if git merge-base --is-ancestor upstream/main origin/fork/main; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          BR="sync/fork-main-$(date -u +%Y%m%d-%H%M)"
          echo "branch=$BR" >> "$GITHUB_OUTPUT"
          git config user.name "fork-sync[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BR"
          if ! git merge --no-edit upstream/main; then
            echo "conflict=true" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          git push origin "$BR"

      - name: Open sync PR
        if: steps.merge.outputs.skip != 'true' && steps.merge.outputs.conflict != 'true'
        run: |
          gh pr create --repo "$GITHUB_REPOSITORY" --base fork/main --head "${{ steps.merge.outputs.branch }}" \
            --title "chore: sync upstream/main → fork/main ($(date -u +%Y-%m-%d))" \
            --body "Automated upstream sync into the fork mainline. Review and merge manually with AI assistance."

      - name: Close resolved conflict issue
        if: steps.merge.outputs.conflict != 'true'
        run: |
          set -euo pipefail
          EXISTING=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "fork-sync: merge conflict" --json number --jq '.[0].number')
          if [ -n "$EXISTING" ]; then
            gh issue close "$EXISTING" --repo "$GITHUB_REPOSITORY" \
              --comment "Resolved — a conflict-free sync ran on $(date -u +%Y-%m-%d)."
          fi

      - name: Notify on merge conflict
        if: failure() && steps.merge.outputs.conflict == 'true'
        run: |
          set -euo pipefail
          CONFLICTS=$(git diff --name-only --diff-filter=U 2>/dev/null || true)
          BODY=$(printf 'The sync hit merge conflicts on %s:\n%s\n\nResolve manually:\n  git fetch upstream\n  git checkout -b sync/manual fork/main\n  git merge upstream/main   # resolve conflicts\n  git push origin sync/manual\n  gh pr create --base fork/main --head sync/manual\n\nThis issue stays open while the conflict persists; a conflict-free sync closes it.' "$(date -u +%Y-%m-%d)" "$CONFLICTS")
          EXISTING=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "fork-sync: merge conflict" --json number --jq '.[0].number')
          if [ -z "$EXISTING" ]; then
            gh issue create --repo "$GITHUB_REPOSITORY" \
              --title "fork-sync: merge conflict syncing upstream/main → fork/main" \
              --body "$BODY"
          else
            # A previous conflict issue is still open — do not mask a new
            # conflict under it; append the current state so it stays tracked.
            gh issue comment "$EXISTING" --repo "$GITHUB_REPOSITORY" --body "$BODY"
          fi
