name: Fork release

# Fork-only release pipeline (mbuckaway/kimi-code). Two modes on push to
# fork/main:
#   - version: an ordinary push computes the next <base>-MB.<x>.<y> version
#     (base read from the fork's OWN apps/kimi-code/package.json — releases
#     never depend on the upstream mirror), opens a version-bump PR
#     ("chore: release …") and auto-merges it (rulesets forbid direct pushes
#     to fork/main).
#   - publish: the merged version-bump commit triggers tagging
#     (v<version>, no slashes so release asset URLs stay clean), a GitHub
#     Release, unsigned native builds, and a refresh of the gh-pages update
#     channel that fork CLIs poll (KIMI_CODE_CDN_BASE →
#     https://mbuckaway.github.io/kimi-code).
# Requires FORK_SYNC_PAT for the version PR (a GITHUB_TOKEN merge would not
# re-trigger this workflow for the publish half).

on:
  push:
    branches:
      - fork/main
  workflow_dispatch:
    inputs:
      bump:
        description: 'MB counter bump for the next release'
        type: choice
        options:
          - minor
          - major
        default: minor
      mode:
        description: 'auto = version; publish forces tag/release of the current package.json version'
        type: choice
        options:
          - auto
          - version
          - publish
        default: auto

permissions:
  contents: write
  pull-requests: write

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  route:
    name: Decide version vs publish
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.route.outputs.mode }}
    steps:
      - name: Inspect trigger
        id: route
        run: |
          # Match the merged version-bump message via jq on the event payload —
          # unquoted bash interpolation of head_commit.message breaks on
          # multiline / backtick commit bodies (exit 2 conditional binary
          # operator expected).
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.mode }}" = "publish" ]; then
            echo "mode=publish" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mode=version" >> "$GITHUB_OUTPUT"
          elif jq -r '.head_commit.message // ""' "$GITHUB_EVENT_PATH" | grep -q '^chore: release '; then
            echo "mode=publish" >> "$GITHUB_OUTPUT"
          else
            echo "mode=version" >> "$GITHUB_OUTPUT"
          fi

  version:
    name: Open release version PR
    needs: route
    if: needs.route.outputs.mode == 'version'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.FORK_SYNC_PAT }}
    outputs:
      version: ${{ steps.v.outputs.version }}
      self_publish: ${{ steps.bump.outputs.self_publish }}
    steps:
      - name: Checkout fork/main
        uses: actions/checkout@v6
        with:
          ref: fork/main
          fetch-depth: 0
          token: ${{ secrets.FORK_SYNC_PAT }}

      - name: Fetch tags
        run: |
          git fetch origin --tags --force

      - name: Compute next version
        id: v
        run: |
          set -euo pipefail
          # The base is the fork's OWN package.json version — the label the fork
          # is shipping. Releasing never depends on the upstream mirror; when the
          # fork later syncs upstream, the sync's conflict resolution bumps this
          # version and the label follows.
          BASE=$(grep -m1 '"version"' apps/kimi-code/package.json \
            | sed -E 's/.*"version": *"([^"]+)".*/\1/' | cut -d- -f1)
          # The MB counter is continuous across upstream bases: the fork keeps
          # carrying its own changes when upstream moves, so the count must not
          # restart at 1.0 and imply the fork patches were dropped.
          LAST=$(git tag -l 'v*-MB.*' | sed -E 's/^v.*-MB\.//' | sort -t. -k1,1n -k2,2n | tail -1)
          BUMP="${{ github.event.inputs.bump }}"
          [ -z "$BUMP" ] && BUMP=minor
          if [ -z "$LAST" ]; then
            NEXT="1.0"
          else
            MAJ=${LAST%%.*}
            MIN=${LAST##*.}
            if [ "$BUMP" = "major" ]; then
              MAJ=$((MAJ + 1)); MIN=0
            else
              MIN=$((MIN + 1))
            fi
            NEXT="$MAJ.$MIN"
          fi
          echo "version=$BASE-MB.$NEXT" >> "$GITHUB_OUTPUT"
          echo "Next fork version: $BASE-MB.$NEXT (base $BASE, bump $BUMP, last ${LAST:-none})"

      - name: Commit version bump, open PR, auto-merge
        id: bump
        run: |
          set -euo pipefail
          V="${{ steps.v.outputs.version }}"
          CURRENT=$(grep -m1 '"version"' apps/kimi-code/package.json | sed -E 's/.*"version": *"([^"]+)".*/\1/')
          # Dotted numeric compare of the -MB.<x>.<y> counters (a >= b).
          ver_ge() { [ "$(printf '%s\n%s' "$2" "$1" | sort -t. -k1,1n -k2,2n | head -1)" = "$2" ]; }
          if [ "$CURRENT" != "$V" ] && ver_ge "${CURRENT##*-MB.}" "${V##*-MB.}"; then
            # CURRENT is already at or past the computed next version (e.g. the
            # bump landed inside a feature PR). Never open a version PR that
            # would downgrade it — publish the current version directly in this
            # run (prepare reads it from package.json), same as if this push had
            # been the merged bump. (No workflow_dispatch: FORK_SYNC_PAT cannot
            # create dispatch events — HTTP 403.)
            echo "package.json already at or past $V (current $CURRENT) — publishing the current version."
            echo "self_publish=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$CURRENT" = "$V" ]; then
            echo "package.json already at $V — nothing to release. Dispatch with mode=publish to re-tag the current version."
            exit 0
          fi
          BR="release/v$V"
          git config user.name "fork-release[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BR"
          node -e "const fs=require('fs');const p='apps/kimi-code/package.json';const j=JSON.parse(fs.readFileSync(p,'utf8'));j.version='$V';fs.writeFileSync(p,JSON.stringify(j,null,2)+'\n')"
          git commit -am "chore: release $V"
          git push origin "$BR"
          PR_URL=$(gh pr create --base fork/main --head "$BR" \
            --title "chore: release $V" \
            --body "Automated fork release version bump. Merging triggers the publish half of fork-release.yml.")
          # --auto fails with "Pull request is in clean status" when the PR is
          # already mergeable (nothing pending to wait for) — merge it directly.
          gh pr merge "$PR_URL" --auto --squash || gh pr merge "$PR_URL" --squash

  prepare:
    name: Tag and create GitHub Release
    needs: [route, version]
    # Runs on the normal publish route (a merged `chore: release` push) or when
    # the version job self-publishes because fork/main's package.json is
    # already at/past the computed next version (skipped version jobs expose
    # empty outputs, so the OR is safe on both paths).
    if: needs.route.outputs.mode == 'publish' || needs.version.outputs.self_publish == 'true'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
    steps:
      - name: Checkout fork/main
        uses: actions/checkout@v6
        with:
          ref: fork/main
          fetch-depth: 0

      - name: Resolve version and tag
        id: v
        run: |
          V=$(grep -m1 '"version"' apps/kimi-code/package.json | sed -E 's/.*"version": *"([^"]+)".*/\1/')
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "tag=v$V" >> "$GITHUB_OUTPUT"

      - name: Tag and create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "fork-release[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git rev-parse -q --verify "refs/tags/${{ steps.v.outputs.tag }}" >/dev/null; then
            git tag "${{ steps.v.outputs.tag }}"
            git push origin "${{ steps.v.outputs.tag }}"
          fi
          if ! gh release view "${{ steps.v.outputs.tag }}" >/dev/null 2>&1; then
            # Create as draft: GitHub now marks releases immutable the moment
            # they are published, so assets must be attached before publishing.
            # publish-assets flips the draft to published after the upload.
            gh release create "${{ steps.v.outputs.tag }}" \
              --target fork/main \
              --title "kimi-code ${{ steps.v.outputs.version }} (mbuckaway fork)" \
              --generate-notes \
              --draft
          fi

  native-artifacts:
    name: Native build (unsigned)
    needs: prepare
    uses: ./.github/workflows/_native-build.yml
    with:
      upload-artifact-prefix: kimi-code-native
      retention-days: 7
      sign-macos: false

  publish-assets:
    name: Upload assets and refresh update channel
    needs:
      - prepare
      - native-artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork/main
        uses: actions/checkout@v6
        with:
          ref: fork/main

      - name: Download native artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: kimi-code-native-*
          path: dist-native-release
          merge-multiple: true

      - name: Produce manifest.json
        run: node apps/kimi-code/scripts/native/produce-manifest.mjs dist-native-release "${{ needs.prepare.outputs.tag }}"

      - name: Upload assets to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ needs.prepare.outputs.tag }}" dist-native-release/* --clobber

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # The release is created as a draft (published releases are immutable
        # and reject asset uploads). Publish it now that the assets are on it.
        run: gh release edit "${{ needs.prepare.outputs.tag }}" --draft=false --latest

      - name: Generate update channel files
        run: node fork/scripts/publish-update-channel.mjs "${{ needs.prepare.outputs.version }}" dist-native-release dist-channel

      - name: Publish update channel to gh-pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          WORK=$(mktemp -d)
          if git ls-remote --exit-code origin gh-pages >/dev/null 2>&1; then
            git clone --depth 1 --branch gh-pages "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$WORK"
          else
            git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$WORK"
            git -C "$WORK" checkout --orphan gh-pages
            git -C "$WORK" rm -rf .
          fi
          cp -R dist-channel/. "$WORK"/
          git -C "$WORK" config user.name "fork-release[bot]"
          git -C "$WORK" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$WORK" add -A
          if git -C "$WORK" diff --cached --quiet; then
            echo "Update channel already current"
            exit 0
          fi
          git -C "$WORK" commit -m "chore: update channel $VERSION"
          git -C "$WORK" push origin gh-pages
